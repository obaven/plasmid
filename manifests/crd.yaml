apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rotationconfigs.plasmidr.obaven.org
spec:
  group: plasmidr.obaven.org
  names:
    kind: RotationConfig
    listKind: RotationConfigList
    plural: rotationconfigs
    singular: rotationconfig
    shortNames:
      - rot
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetSecret:
                  type: string
                keys:
                  type: array
                  items:
                    type: string
                template:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                schedule:
                  type: string
